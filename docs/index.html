<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Desk demo · Lucas Walsh</title>
<meta name="description" content="Click-through demo of Lead Desk, an AI lead desk where a person approves every message. Fictional data.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="demo-banner" role="note">Demo. Fictional data. AI responses are prerecorded. Nothing is sent anywhere.</div>
<div class="app">
  <aside class="side" id="side" aria-label="Main">
    <a class="brand" href="#overview" aria-label="Lead Desk home">
      <svg viewBox="0 0 32 36" width="28" height="31" aria-hidden="true"><path d="M3 4h26v16c0 8-6 12-13 15C9 32 3 28 3 20z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9 12h14M9 17h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Lead Desk<small>Bluebird Catering Co. (sample)</small></span>
    </a>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <span class="live on">demo</span>
      <button class="ghost-btn" id="theme" type="button" aria-label="Switch light and dark theme">Theme</button>
    </div>
    <div class="tenant">Built by Lucas Walsh. All companies, people, emails and numbers are made up.</div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="content">
    <header class="topbar">
      <button class="icon-only" id="menu" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb" id="crumb"></div><div class="grow"></div>
      <button id="reset" type="button">Reset demo</button>
      <a class="btn" href="https://github.com/lucaswalsh90-ctrl/portfolio">Portfolio</a>
    </header>
    <div class="banner" role="note">Nothing is sent automatically. Every message waits for a person to approve it.</div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
